<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCみたか04 - 選手抽選スロット</title>
    <style>
        :root {
            --bg-clean-white: #ffffff;
            --text-pure-white: #ffffff;
            --text-dark: #1a1a2e;
            --border-dark: #222222;
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Meiryo', sans-serif;
            background-color: var(--bg-clean-white); 
            display: flex;
            flex-direction: column;
            height: 100vh;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            color: var(--text-dark);
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* スロットの窓 */
        .slot-border-wrap {
            width: 100%;
            max-width: 950px;
            height: 55vh;
            padding: 0;
            border: 6px solid var(--border-dark);
            border-radius: 24px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.08);
            background-color: #ffffff;
            overflow: hidden;
            z-index: 2; 
        }

        .slot-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden; 
        }

        .slot-reel {
            position: absolute;
            top: 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: transform 0.1s linear;
        }

        .slot-item {
            height: 55vh; 
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(65px, 14vw, 150px); 
            font-weight: 900;
            text-align: center;
            white-space: nowrap;
            color: var(--text-pure-white);
            text-shadow: 0 4px 12px rgba(0, 0, 0, 0.25); 
        }

        .slot-container.stopped .slot-item-winner {
            animation: luckyJump 0.25s ease-in-out 3;
        }

        @keyframes luckyJump {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); filter: brightness(1.1); }
            100% { transform: scale(1); }
        }

        /* ★お送りいただいた画像(image_5a1de7.png)を反映した大きなボールパーティクル */
        .ball-particle {
            position: absolute;
            width: 80px;  /* さらに大きく目立つサイズに変更 */
            height: 80px;
            background-image: url('image_5a1de7.png');
            background-size: cover;
            background-repeat: no-repeat;
            z-index: 999;
            pointer-events: none;
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.25));
        }

        /* 窓の中でリフティングするボールのスタイル */
        .ball {
            width: 90px;
            height: 90px;
            background-image: url('image_5a1de7.png');
            background-size: cover;
            background-repeat: no-repeat;
            position: absolute;
            bottom: 40px;
            display: none;
            z-index: 5;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.3));
        }

        /* 縦揺れリフティング */
        @keyframes lift {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-90px) scale(1.05); }
            100% { transform: translateY(0) scale(1); }
        }
        .ball.lifting {
            display: block;
            animation: lift 0.35s ease-in-out infinite;
        }

        footer {
            margin-top: 30px;
            width: 100%;
            max-width: 950px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 18vh;
            gap: 25px;
            background: #f8f9fa; 
            padding: 15px 25px;
            border-radius: 20px;
            border: 2px solid #e9ecef;
            z-index: 2;
        }

        .start-btn {
            flex: 0 0 260px;
            height: 100%;
            background: var(--border-dark);
            color: #ffffff; 
            border: none;
            font-size: 32px;
            font-weight: 900;
            border-radius: 16px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            transition: all 0.1s ease;
            letter-spacing: 2px;
        }

        .start-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(0, 0, 0, 0.15);
            background-color: #333333;
        }

        .start-btn:disabled {
            background: #e9ecef; color: #adb5bd; cursor: not-allowed; box-shadow: none; transform: none;
        }

        .member-list-area {
            flex: 1; text-align: left; height: 100%; display: flex; flex-direction: column; justify-content: center;
        }

        .member-list-title { font-size: 13px; color: #6c757d; margin: 0 0 8px 0; font-weight: bold; }
        .member-checkboxes { display: flex; flex-wrap: wrap; gap: 8px; overflow-y: auto; }
        .member-item {
            font-size: 13px; background: #ffffff; color: var(--text-dark); padding: 8px 14px; border-radius: 10px;
            display: flex; align-items: center; cursor: pointer; border: 2px solid #e9ecef; font-weight: bold; transition: all 0.15s;
        }
        .member-item:hover { background: #f1f3f5; border-color: var(--border-dark); }
        .member-item input { margin-right: 8px; accent-color: var(--border-dark); transform: scale(1.1); }
        .member-item.excluded { background: #e9ecef; color: #adb5bd; border-color: transparent; text-decoration: line-through; }
    </style>
</head>
<body>

    <div class="slot-border-wrap">
        <div class="slot-container" id="slotWindow">
            <div id="ball" class="ball"></div>
            <div id="reel" class="slot-reel"></div>
        </div>
    </div>

    <footer>
        <button id="startBtn" class="start-btn">スタート</button>

        <div class="member-list-area">
            <p class="member-list-title">▼ 待している選手（おわったらチェックしてね）</p>
            <div id="memberCheckboxes" class="member-checkboxes"></div>
        </div>
    </footer>

<script>
    const playerColors = [
        { name: "さやか", color: "#ff007f", suffix: "ちゃん" },       
        { name: "おおつか", color: "#00bfff", suffix: "くん" },     
        { name: "ゆう", color: "#bd00ff", suffix: "くん" },         
        { name: "いちか", color: "#7cee00", suffix: "ちゃん" },       
        { name: "いと", color: "#ff9900", suffix: "くん" },         
        { name: "りょう", color: "#00f5d4", suffix: "くん" },       
        { name: "れん", color: "#0066ff", suffix: "くん" },         
        { name: "ゆうki", color: "#9b5de5", suffix: "くん" },       
        { name: "いつき", color: "#f15bb5", suffix: "くん" },       
        { name: "ともき", color: "#fee440", suffix: "くん" }        
    ];
    playerColors[7].name = "ゆうき";

    let excludedPlayers = [];

    const ball = document.getElementById('ball');
    const reel = document.getElementById('reel');
    const startBtn = document.getElementById('startBtn');
    const slotWindow = document.getElementById('slotWindow');
    const memberCheckboxes = document.getElementById('memberCheckboxes');

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playTickSound() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.type = 'sine'; osc.frequency.setValueAtTime(600, audioCtx.currentTime); 
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime); 
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05); 
        osc.start(); osc.stop(audioCtx.currentTime + 0.05);
    }

    function playFanfareSound() {
        const notes = [523.25, 659.25, 783.99, 1046.50]; 
        notes.forEach((freq, index) => {
            setTimeout(() => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.4);
                osc.start(); osc.stop(audioCtx.currentTime + 0.4);
            }, index * 100);
        });
    }

    function speakPlayerName(playerObj) {
        const utterance = new SpeechSynthesisUtterance();
        const messages = ["よろしくね！", "がんばって！", "ファイト！！"];
        const randomMessage = messages[Math.floor(Math.random() * messages.length)];
        
        utterance.text = playerObj.name + playerObj.suffix + "、" + randomMessage; 
        utterance.lang = 'ja-JP'; 

        const voices = window.speechSynthesis.getVoices();
        const isGirlVoice = Math.random() > 0.5;
        
        if (isGirlVoice) {
            const girlVoice = voices.find(v => v.lang.includes('ja') && (v.name.includes('Haruka') || v.name.includes('Sayuri') || v.name.includes('Google') || v.name.includes('Kyoko')));
            if (girlVoice) utterance.voice = girlVoice;
            utterance.pitch = 2.0; utterance.rate = 1.45;  
        } else {
            const boyVoice = voices.find(v => v.lang.includes('ja') && (v.name.includes('Ichiro') || v.name.includes('Ototoba') || v.name.includes('Mizuki') || v.name.includes('Male')));
            if (boyVoice) utterance.voice = boyVoice;
            utterance.pitch = 1.8; utterance.rate = 1.4;  
        }
        window.speechSynthesis.speak(utterance);
    }

    // ★上下左右から巨大サッカーボールが飛び出す新演出
    function popSoccerBalls() {
        const ballCount = 75; 

        for (let i = 0; i < ballCount; i++) {
            const ballItem = document.createElement('div');
            ballItem.className = 'ball-particle';
            
            const direction = Math.floor(Math.random() * 4);
            let vx = 0; let vy = 0;

            if (direction === 0) { // 左から
                ballItem.style.left = '-80px';
                ballItem.style.top = (Math.random() * window.innerHeight) + 'px';
                vx = 15 + Math.random() * 20; vy = Math.random() * 20 - 10;
            } else if (direction === 1) { // 右から
                ballItem.style.left = (window.innerWidth + 80) + 'px';
                ballItem.style.top = (Math.random() * window.innerHeight) + 'px';
                vx = -(15 + Math.random() * 20); vy = Math.random() * 20 - 10;
            } else if (direction === 2) { // 上から
                ballItem.style.left = (Math.random() * window.innerWidth) + 'px';
                ballItem.style.top = '-80px';
                vx = Math.random() * 20 - 10; vy = 10 + Math.random() * 15;
            } else { // 下から
                ballItem.style.left = (Math.random() * window.innerWidth) + 'px';
                ballItem.style.top = (window.innerHeight + 80) + 'px';
                vx = Math.random() * 20 - 10; vy = -(20 + Math.random() * 15);
            }

            document.body.appendChild(ballItem);

            const gravity = direction === 2 ? 0.3 : (direction === 3 ? 0.8 : 0.5); 
            let posX = parseFloat(ballItem.style.left);
            let posY = parseFloat(ballItem.style.top);

            function updateAnimation() {
                posX += vx; posY += vy; vy += gravity; vx *= 0.99;
                ballItem.style.left = posX + 'px';
                ballItem.style.top = posY + 'px';
                ballItem.style.transform = `rotate(${posY * 4}deg)`; 

                if (posY < window.innerHeight + 100 && posY > -100 && posX > -100 && posX < window.innerWidth + 100) {
                    requestAnimationFrame(updateAnimation);
                } else {
                    ballItem.remove();
                }
            }
            
            setTimeout(() => {
                requestAnimationFrame(updateAnimation);
            }, Math.random() * 300); 
        }
    }

    function initSlot() {
        reel.innerHTML = `<div class="slot-item" style="background-color: ${playerColors[0].color}">${playerColors[0].name}</div>`;
        initList();
    }

    function initList() {
        memberCheckboxes.innerHTML = '';
        playerColors.forEach((p, i) => {
            const label = document.createElement('label');
            label.className = 'member-item';
            const box = document.createElement('input');
            box.type = 'checkbox';
            box.onchange = () => {
                if(box.checked) { excludedPlayers.push(p.name); label.className = 'member-item excluded'; }
                else { excludedPlayers = excludedPlayers.filter(name => name !== p.name); label.className = 'member-item'; }
            };
            label.appendChild(box);
            label.appendChild(document.createTextNode(p.name));
            memberCheckboxes.appendChild(label);
        });
    }

    function startSlot() {
        if (audioCtx.state === 'suspended') { audioCtx.resume(); }
        window.speechSynthesis.cancel();

        const pool = playerColors.filter(p => !excludedPlayers.includes(p.name));
        if (pool.length === 0) {
            alert("全員おわりました！チェックを外してリセットしてね。");
            return;
        }

        startBtn.disabled = true;
        slotWindow.className = 'slot-container'; 
        ball.className = 'ball lifting'; // 回転中は窓の中でボールを跳ねさせる

        const shuffleCount = 25; 
        let reelHTML = ''; let shuffleArray = [];
        for (let i = 0; i < shuffleCount; i++) {
            shuffleArray = shuffleArray.concat(pool.sort(() => Math.random() - 0.5));
        }
        
        const winner = pool[Math.floor(Math.random() * pool.length)];
        shuffleArray.push(winner);

        shuffleArray.forEach((p, index) => {
            const isWinnerClass = (index === shuffleArray.length - 1) ? 'slot-item-winner' : '';
            reelHTML += `<div class="slot-item ${isWinnerClass}" style="background-color: ${p.color}">${p.name}</div>`;
        });
        reel.innerHTML = reelHTML;

        const singleHeight = slotWindow.clientHeight;
        document.querySelectorAll('.slot-item').forEach(item => { item.style.height = singleHeight + 'px'; });

        reel.style.transition = 'none';
        reel.style.transform = 'translateY(0px)';

        setTimeout(() => {
            const travelDistance = singleHeight * (shuffleArray.length - 1);
            reel.style.transition = 'transform 4.0s cubic-bezier(0.1, 0.8, 0.1, 1)';
            reel.style.transform = `translateY(-${travelDistance}px)`;

            let soundInterval = 60;
            function triggerTick() {
                if (soundInterval < 500) { 
                    playTickSound(); soundInterval *= 1.12; 
                    setTimeout(triggerTick, soundInterval);
                }
            }
            triggerTick();
        }, 50);

        setTimeout(() => {
            slotWindow.className = 'slot-container stopped'; 
            ball.className = 'ball'; // 停止
            
            playFanfareSound();     
            popSoccerBalls();        
            speakPlayerName(winner); 
            
            startBtn.disabled = false;
        }, 4050);
    }

    window.addEventListener('resize', () => {
        const singleHeight = slotWindow.clientHeight;
        document.querySelectorAll('.slot-item').forEach(item => { item.style.height = singleHeight + 'px'; });
    });

    startBtn.addEventListener('click', startSlot);
    initSlot();
</script>

</body>
</html>
